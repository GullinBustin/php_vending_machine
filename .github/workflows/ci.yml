name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Lint
        run: docker compose run --rm test composer lint

      - name: Analyse
        run: docker compose run --rm test composer analyse

      - name: Test
        run: docker compose run --rm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
